AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Backend de nitalmal — API protegida con Firebase (Google login) como bearer token.
  API Gateway HTTP API + JWT Authorizer + Lambda + DynamoDB.

Parameters:
  FirebaseProjectId:
    Type: String
    Default: nitanmal-a75de
    Description: Project ID del Firebase de nitalmal (issuer/audience del JWT).

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs22.x
    Architectures:
      - arm64

Resources:
  # ── API HTTP con validación del Firebase ID token (bearer) ──
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          FirebaseAuth:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://securetoken.google.com/${FirebaseProjectId}"
              audience:
                - !Ref FirebaseProjectId
        DefaultAuthorizer: FirebaseAuth
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  # ── Tabla de usuarios / miembros ──
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nitalmal-usuarios
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # ── Bucket para las fotos de perfil (privado; se sirven con URL firmada) ──
  AvatarsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "nitalmal-avatars-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  # ── Tabla de eventos / shows programados ──
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nitalmal-eventos
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Agenda de reuniones del equipo (participantes) ──
  ReunionesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nitalmal-reuniones
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Notas / ideas del equipo ──
  NotasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nitalmal-notas
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Episodios (gestionados desde el panel) ──
  EpisodiosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nitalmal-episodios
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Descargas (metadatos; archivos en S3) ──
  DescargasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nitalmal-descargas
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Preguntas / buzón del público ──
  PreguntasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nitalmal-preguntas
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Pipeline de producción de episodios ──
  ProduccionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nitalmal-produccion
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Notificaciones in-app (por usuario) ──
  NotificacionesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nitalmal-notificaciones
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # ── Config del sitio (estado "en vivo", etc.) ──
  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nitalmal-config
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Bucket privado para las descargas de la zona miembros ──
  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "nitalmal-archivos-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  # ── Lambda del API ──
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: nitalmal-api
      Handler: index.handler
      CodeUri: src/
      Environment:
        Variables:
          TABLE_USERS: !Ref UsersTable
          TABLE_EVENTS: !Ref EventsTable
          TABLE_REUNIONES: !Ref ReunionesTable
          TABLE_NOTAS: !Ref NotasTable
          TABLE_EPISODIOS: !Ref EpisodiosTable
          TABLE_DESCARGAS: !Ref DescargasTable
          TABLE_PREGUNTAS: !Ref PreguntasTable
          TABLE_CONFIG: !Ref ConfigTable
          TABLE_PRODUCCION: !Ref ProduccionTable
          TABLE_NOTIFICACIONES: !Ref NotificacionesTable
          AVATARS_BUCKET: !Ref AvatarsBucket
          FILES_BUCKET: !Ref FilesBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReunionesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotasTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EpisodiosTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DescargasTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PreguntasTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProduccionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificacionesTable
        - S3CrudPolicy:
            BucketName: !Ref AvatarsBucket
        - S3CrudPolicy:
            BucketName: !Ref FilesBucket
      Events:
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: GET
        UpdateMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: PUT
        AvatarUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /avatar-upload
            Method: POST
        ListEventos:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /eventos
            Method: GET
        CreateEvento:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /eventos
            Method: POST
        DeleteEvento:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /eventos/{id}
            Method: DELETE
        ListReuniones:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /reuniones
            Method: GET
        CreateReunion:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /reuniones
            Method: POST
        DeleteReunion:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /reuniones/{id}
            Method: DELETE
        ListNotas:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notas
            Method: GET
        CreateNota:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notas
            Method: POST
        DeleteNota:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notas/{id}
            Method: DELETE
        ListUsuarios:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /usuarios
            Method: GET
        SetUsuarioRole:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /usuarios/{id}/role
            Method: PUT
        ListEpisodios:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /episodios
            Method: GET
        CreateEpisodio:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /episodios
            Method: POST
        UpdateEpisodio:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /episodios/{id}
            Method: PUT
        DeleteEpisodio:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /episodios/{id}
            Method: DELETE
        ListDescargas:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /descargas
            Method: GET
        DescargaUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /descargas-upload
            Method: POST
        CreateDescarga:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /descargas
            Method: POST
        DeleteDescarga:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /descargas/{id}
            Method: DELETE
        CreatePregunta:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /preguntas
            Method: POST
        ListPreguntas:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /preguntas
            Method: GET
        UpdatePregunta:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /preguntas/{id}
            Method: PUT
        DeletePregunta:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /preguntas/{id}
            Method: DELETE
        GetLive:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /live
            Method: GET
        SetLive:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /live
            Method: PUT
        SuscripcionPreferencia:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /suscripcion/preferencia
            Method: POST
        SuscripcionPagar:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /suscripcion/pagar
            Method: POST
        SuscripcionCancelar:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /suscripcion/cancelar
            Method: POST
        ListPlantillas:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /plantillas
            Method: GET
        ListProduccion:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /produccion
            Method: GET
        CreateProduccion:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /produccion
            Method: POST
        ProduccionUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /produccion-upload
            Method: POST
        UpdateProduccion:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /produccion/{id}
            Method: PUT
        DeleteProduccion:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /produccion/{id}
            Method: DELETE
        GetEquipo:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /equipo
            Method: GET
        ListNotificaciones:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notificaciones
            Method: GET
        LeerNotificaciones:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notificaciones/leer
            Method: POST

Outputs:
  ApiUrl:
    Description: URL base del API (usar en VITE_API_URL del frontend)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UsersTableName:
    Value: !Ref UsersTable
