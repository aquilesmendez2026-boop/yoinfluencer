AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Backend de Yo Influencer — API protegida con Firebase (Google login) como bearer token.
  API Gateway HTTP API + JWT Authorizer + Lambda + DynamoDB.

Parameters:
  FirebaseProjectId:
    Type: String
    Default: nitanmal-a75de
    Description: Project ID del Firebase del proyecto (issuer/audience del JWT).
  AdminEmail:
    Type: String
    Default: "aquiles@umine.com"
    Description: >
      Email que recibe rol admin la primera vez que inicia sesion. Resuelve el
      arranque en frio: con la tabla de usuarios vacia nadie puede promover a nadie.
      Solo aplica al crear el usuario, no reescala cuentas existentes.

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs22.x
    Architectures:
      - arm64

Resources:
  # ── API HTTP con validación del Firebase ID token (bearer) ──
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          FirebaseAuth:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://securetoken.google.com/${FirebaseProjectId}"
              audience:
                - !Ref FirebaseProjectId
        DefaultAuthorizer: FirebaseAuth
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  # ── Tabla de usuarios / miembros ──
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yoinfluencer-usuarios
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # ── Bucket para las fotos de perfil (privado; se sirven con URL firmada) ──
  AvatarsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "yoinfluencer-avatars-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  # ── Tabla de eventos / shows programados ──
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yoinfluencer-eventos
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Agenda de reuniones del equipo (participantes) ──
  ReunionesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yoinfluencer-reuniones
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Notas / ideas del equipo ──
  NotasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yoinfluencer-notas
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Episodios (gestionados desde el panel) ──
  EpisodiosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yoinfluencer-episodios
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Descargas (metadatos; archivos en S3) ──
  DescargasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yoinfluencer-descargas
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Preguntas / buzón del público ──
  PreguntasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yoinfluencer-preguntas
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Pipeline de producción de episodios ──
  ProduccionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yoinfluencer-produccion
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Notificaciones in-app (por usuario) ──
  NotificacionesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yoinfluencer-notificaciones
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # ── Catálogo de lugares visitados (restaurantes, cines, panoramas…) ──
  LugaresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yoinfluencer-lugares
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Perfiles de redes sociales del creador ──
  RedesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yoinfluencer-redes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Secciones editoriales (temáticas del medio) ──
  SeccionesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yoinfluencer-secciones
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Historial de en vivos ya realizados ──
  LivesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yoinfluencer-lives
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Config del sitio (estado "en vivo", etc.) ──
  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yoinfluencer-config
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ── Bucket privado para las descargas de la zona miembros ──
  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "yoinfluencer-archivos-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  # ── Amazon Location: geocoding, mapa y llave para el navegador ──
  # Place Index (geocoding/autocompletado) — lo consulta la Lambda (server-side).
  PlacesIndex:
    Type: AWS::Location::PlaceIndex
    Properties:
      IndexName: yoinfluencer-places
      DataSource: Esri
      DataSourceConfiguration:
        IntendedUse: Storage
  # Mapa (tiles) — lo renderiza el navegador con MapLibre + la API key.
  LocationMap:
    Type: AWS::Location::Map
    Properties:
      MapName: yoinfluencer-map
      Configuration:
        Style: VectorEsriDarkGrayCanvas
  # API key para el navegador: solo lee tiles del mapa, restringida por dominio.
  LocationApiKey:
    Type: AWS::Location::APIKey
    Properties:
      KeyName: yoinfluencer-map-key
      NoExpiry: true
      Restrictions:
        AllowActions:
          - geo:GetMap*
        AllowResources:
          - !GetAtt LocationMap.Arn
        AllowReferers:
          - https://main.d4mydnmdld2ms.amplifyapp.com/*
          - http://localhost:*/*

  # ── Lambda del API ──
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yoinfluencer-api
      Handler: index.handler
      CodeUri: src/
      Environment:
        Variables:
          TABLE_USERS: !Ref UsersTable
          TABLE_EVENTS: !Ref EventsTable
          TABLE_REUNIONES: !Ref ReunionesTable
          TABLE_NOTAS: !Ref NotasTable
          TABLE_EPISODIOS: !Ref EpisodiosTable
          TABLE_DESCARGAS: !Ref DescargasTable
          TABLE_PREGUNTAS: !Ref PreguntasTable
          TABLE_CONFIG: !Ref ConfigTable
          TABLE_PRODUCCION: !Ref ProduccionTable
          TABLE_NOTIFICACIONES: !Ref NotificacionesTable
          TABLE_LUGARES: !Ref LugaresTable
          TABLE_REDES: !Ref RedesTable
          TABLE_LIVES: !Ref LivesTable
          TABLE_SECCIONES: !Ref SeccionesTable
          ADMIN_EMAIL: !Ref AdminEmail
          AVATARS_BUCKET: !Ref AvatarsBucket
          FILES_BUCKET: !Ref FilesBucket
          SUPERADMIN_EMAIL: aquiles@umine.com
          PLACE_INDEX: !Ref PlacesIndex
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReunionesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotasTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EpisodiosTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DescargasTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PreguntasTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProduccionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificacionesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LugaresTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RedesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LivesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SeccionesTable
        - S3CrudPolicy:
            BucketName: !Ref AvatarsBucket
        - S3CrudPolicy:
            BucketName: !Ref FilesBucket
        # Geocoding server-side (endpoint /geocode).
        - Statement:
            - Effect: Allow
              Action:
                - geo:SearchPlaceIndexForText
                - geo:SearchPlaceIndexForSuggestions
                - geo:GetPlace
              Resource: !GetAtt PlacesIndex.Arn
      # Un evento por método (no ANY) para que OPTIONS quede fuera del authorizer
      # y CORS responda la preflight solo. Son 4 permisos, muy por debajo del límite.
      Events:
        ProxyGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: GET
        ProxyPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: POST
        ProxyPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: PUT
        ProxyDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: DELETE

Outputs:
  ApiUrl:
    Description: URL base del API (usar en VITE_API_URL del frontend)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UsersTableName:
    Value: !Ref UsersTable
  LocationMapName:
    Description: Nombre del mapa de Amazon Location (VITE_LOCATION_MAP)
    Value: !Ref LocationMap
  LocationRegion:
    Description: Región de Amazon Location (VITE_LOCATION_REGION)
    Value: !Ref AWS::Region
  LocationApiKeyName:
    Description: Nombre de la API key (el valor se saca con describe-key)
    Value: !Ref LocationApiKey
