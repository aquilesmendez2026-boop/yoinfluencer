version = 0.1

# Nota: en local despliega con  sam deploy --profile nitalmal
# El perfil sigue siendo el de la cuenta AWS de nitalmal; el stack es nuevo
# y no toca el stack nitalmal-backend ni sus tablas.
# En CI (GitHub Actions) las credenciales vienen por OIDC (sin profile).
[default.deploy.parameters]
stack_name = "yoinfluencer-backend"
region = "us-east-2"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
disable_rollback = false
