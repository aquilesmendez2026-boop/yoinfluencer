AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bootstrap (una sola vez) para CI/CD por OIDC: crea el proveedor OIDC de
  GitHub y un rol que GitHub Actions asume para desplegar el backend de
  nitalmal. NO usa llaves de AWS permanentes.
  Despliega este stack con una identidad ADMIN (consola / CloudShell),
  no con el usuario acotado nitalmal-deployer.

Parameters:
  GitHubOrg:
    Type: String
    Default: aquilesmendez2026-boop
    Description: Dueño del repositorio en GitHub.
  GitHubRepo:
    Type: String
    Default: nitalmal
    Description: Nombre del repositorio.

Resources:
  # Proveedor OIDC de GitHub Actions (uno por cuenta).
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Rol que GitHub Actions asume (solo desde este repo) para desplegar.
  DeployRole:
    Type: AWS::IAM::Role
    DependsOn: GitHubOIDCProvider
    Properties:
      RoleName: nitalmal-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
      Policies:
        - PolicyName: nitalmal-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - lambda:*
                  - apigateway:*
                  - dynamodb:*
                  - logs:*
                  - s3:*
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - lambda.amazonaws.com
                      - apigateway.amazonaws.com

Outputs:
  DeployRoleArn:
    Description: ARN del rol. Guárdalo como variable de repo AWS_DEPLOY_ROLE_ARN en GitHub.
    Value: !GetAtt DeployRole.Arn
